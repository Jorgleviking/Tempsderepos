name: Build Tempsderepos APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Décompresser le projet
        run: |
          unzip -o Tempsderepos.zip

      - name: Construire l'APK
        working-directory: Tempsderepos
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Tempsderepos-APK
          path: Tempsderepos/app/build/outputs/apk/debug/app-debug.apk
